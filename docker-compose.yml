services:
  mysql:
    image: mysql:8.4
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_DATABASE: company

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - springboot-network

  springboot-app:
    build: .

    depends_on:
      - mysql

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/company
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: n3u3da!
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_SQL_INIT_MODE: always

    ports:
      - "8082:8082"

    networks:
      - springboot-network
volumes:
  mysql-data:

networks:
  springboot-network:
